name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim-version: ["stable", "nightly"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Verify Neovim version
        run: nvim --version

      - name: Bootstrap mini.nvim
        run: |
          # Let nvim auto-install mini.nvim on first run
          nvim --headless -c "lua vim.wait(2000, function() return false end)" -c "qall!" || true

      - name: Run smoke test
        run: |
          # Verify config loads without errors
          NVIM_TEST_SYNC=1 nvim --headless \
            -c "lua vim.wait(1000, function() return false end)" \
            -c "qall!"

      - name: Run CI tests
        run: |
          # Every spec except those whose header carries a `@ci-skip:` directive.
          # This matches the local :RunTestCI command and `mise run test`.
          NVIM_TEST_SYNC=1 nvim --headless \
            -c "lua require('kyleking.utils.test_runner').run_ci_tests()" \
            -c "qall!"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      # Plugins are not installed in CI, so cross-plugin requires resolve to
      # warnings; the gate is errors only.
      - name: Run emmylua_check
        run: mise run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Run hk
        run: mise exec -- hk check --all
        env:
          # Steps needing tools the runner lacks or work another job already does:
          # - generate-plugin-docs/helptags/panvimdoc: need nvim and pandoc
          # - lua-diagnostics: needs lua-language-server
          # - measure-startup/mini-test: need nvim; tests run in the test job
          HK_SKIP_STEPS: generate-plugin-docs,helptags,lua-diagnostics,measure-startup,mini-test,panvimdoc
